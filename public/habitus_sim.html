<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생게임: 아비투스</title>
<meta name="description" content="가정 배경(경제·문화·사회자본)이 인생 전반의 기회에 미치는 영향을 체험하는 통합사회 수업용 시뮬레이션 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ THEME TOKENS ============ */
  :root{
    --bg: #E9EEDF;
    --bg-2: #DDE6CC;
    --surface: #FCFAF0;
    --surface-2: #F3EFDC;
    --surface-border: #D8CFAE;
    --ink: #2A2A20;
    --ink-soft: #635F49;
    --ink-faint: #8A8567;

    --accent: #C2452C;
    --accent-ink: #FFF7EC;
    --accent-soft: #EAD9C9;

    --cap-econ: #B4841F;
    --cap-econ-soft: #F2E4C2;
    --cap-culture: #2F7A67;
    --cap-culture-soft: #D9EEE6;
    --cap-social: #4E62A0;
    --cap-social-soft: #DEE3F4;
    --cap-info: #954E82;
    --cap-info-soft: #F0DEEC;

    --good: #2F7A4F;
    --bad: #B23B3B;
    --shadow: 0 10px 30px -12px rgba(42,42,32,0.35);
    --shadow-sm: 0 4px 14px -6px rgba(42,42,32,0.28);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;

    --font-display: 'Black Han Sans', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --font-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #131C16;
      --bg-2: #0E1611;
      --surface: #1D2A21;
      --surface-2: #24352A;
      --surface-border: #35492D;
      --ink: #EEE9D6;
      --ink-soft: #B7B39C;
      --ink-faint: #8A8B76;

      --accent: #E3714E;
      --accent-ink: #201007;
      --accent-soft: #3C2A20;

      --cap-econ: #E3BE5C;
      --cap-econ-soft: #3A311A;
      --cap-culture: #62C1A5;
      --cap-culture-soft: #1B3A31;
      --cap-social: #93A5EA;
      --cap-social-soft: #232A4A;
      --cap-info: #D390C0;
      --cap-info-soft: #3A2536;

      --good: #6FCB8E;
      --bad: #E28080;
      --shadow: 0 10px 34px -10px rgba(0,0,0,0.55);
      --shadow-sm: 0 4px 16px -6px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #131C16;
    --bg-2: #0E1611;
    --surface: #1D2A21;
    --surface-2: #24352A;
    --surface-border: #35492D;
    --ink: #EEE9D6;
    --ink-soft: #B7B39C;
    --ink-faint: #8A8B76;

    --accent: #E3714E;
    --accent-ink: #201007;
    --accent-soft: #3C2A20;

    --cap-econ: #E3BE5C;
    --cap-econ-soft: #3A311A;
    --cap-culture: #62C1A5;
    --cap-culture-soft: #1B3A31;
    --cap-social: #93A5EA;
    --cap-social-soft: #232A4A;
    --cap-info: #D390C0;
    --cap-info-soft: #3A2536;

    --good: #6FCB8E;
    --bad: #E28080;
    --shadow: 0 10px 34px -10px rgba(0,0,0,0.55);
    --shadow-sm: 0 4px 16px -6px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 560px at 12% -8%, var(--bg-2), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--bg-2), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:var(--font-display); font-weight:400; letter-spacing:.01em; text-wrap:balance; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  .app{ max-width:900px; margin:0 auto; padding:20px 16px 64px; }

  /* ============ HUD ============ */
  .hud{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:10px;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(8px);
    border:1px solid var(--surface-border);
    border-radius:var(--radius-md);
    padding:10px 14px;
    margin:0 0 18px;
    box-shadow:var(--shadow-sm);
    flex-wrap:wrap;
  }
  .hud-id{ display:flex; align-items:center; gap:8px; font-weight:800; }
  .hud-avatar{ font-size:22px; line-height:1; }
  .hud-name{ font-size:14px; color:var(--ink-soft); }
  .hud-stats{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px; font-weight:700; padding:5px 9px; border-radius:999px;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .chip-econ{ background:var(--cap-econ-soft); color:var(--cap-econ); }
  .chip-culture{ background:var(--cap-culture-soft); color:var(--cap-culture); }
  .chip-social{ background:var(--cap-social-soft); color:var(--cap-social); }
  .chip-info{ background:var(--cap-info-soft); color:var(--cap-info); }
  .chip-cash{ background:var(--accent-soft); color:var(--accent); font-family:var(--font-mono); }
  .hud-hide{ display:none !important; }

  /* ============ STEPPER ============ */
  .stepper{ display:flex; gap:5px; margin:0 0 18px; overflow-x:auto; padding:2px; }
  .step-dot{
    flex:0 0 auto; width:9px; height:9px; border-radius:50%;
    background:var(--surface-border);
  }
  .step-dot.done{ background:var(--cap-culture); }
  .step-dot.now{ background:var(--accent); transform:scale(1.5); }

  /* ============ CARD SHELL ============ */
  .stage-card{
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:var(--radius-lg);
    padding:28px 26px;
    box-shadow:var(--shadow);
    animation:riseIn .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .hero-track{ max-width:480px; margin:2px auto 22px; text-align:center; }
  .hero-track svg{ width:100%; height:auto; display:block; overflow:visible; }
  .hero-dot{ transform-box:fill-box; transform-origin:50% 50%; animation:heroPulse 2.6s ease-in-out infinite; }
  @keyframes heroPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }
  .hero-caption{ margin:8px 0 0; font-size:12.5px; color:var(--ink-faint); font-weight:800; letter-spacing:.03em; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; letter-spacing:.06em;
    color:var(--accent); text-transform:uppercase; margin:0 0 6px;
  }
  .stage-title{ font-size:clamp(22px,4vw,32px); margin:0 0 8px; }
  .stage-desc{ color:var(--ink-soft); font-size:15px; margin:0 0 20px; max-width:62ch; }
  .stage-desc p{ margin:0 0 10px; }

  .btn{
    appearance:none; border:2px solid var(--ink); background:var(--ink); color:var(--surface);
    font-weight:800; font-size:15px; padding:12px 20px; border-radius:999px;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .btn:active{ transform:translateY(0); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .btn-primary{ border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
  .btn-ghost{ background:transparent; color:var(--ink); }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .btn-sm{ padding:8px 14px; font-size:13px; }

  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin:6px 0; }
  .choice-card{
    text-align:left; border:2px solid var(--surface-border); background:var(--surface-2);
    border-radius:var(--radius-md); padding:14px 16px; cursor:pointer;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    display:flex; flex-direction:column; gap:6px; color:var(--ink); font-family:inherit;
  }
  .choice-card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .choice-card:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .choice-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .choice-card[disabled]{ opacity:.42; cursor:not-allowed; transform:none; }
  .choice-title{ font-weight:800; font-size:15.5px; }
  .choice-meta{ font-size:12.5px; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap; }
  .tag{ display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface); border:1px solid var(--surface-border); }

  .statbar-wrap{ margin:10px 0; }
  .statbar-label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:4px; }
  .statbar-track{ height:9px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--surface-border); }
  .statbar-fill{ height:100%; border-radius:999px; transition:width .7s cubic-bezier(.2,.8,.2,1); }

  .mission-slots{ display:flex; gap:6px; margin:0 0 14px; }
  .slot{ width:22px; height:22px; border-radius:6px; border:2px solid var(--surface-border); }
  .slot.used{ background:var(--accent); border-color:var(--accent); }

  /* roulette */
  .roulette-zone{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:10px 0 6px; }
  .roulette-wrap{ position:relative; width:min(280px,72vw); height:min(280px,72vw); }
  .roulette-wheel{
    width:100%; height:100%; border-radius:50%;
    border:6px solid var(--surface); box-shadow:var(--shadow), inset 0 0 0 2px var(--surface-border);
    transition:transform 3.2s cubic-bezier(.12,.85,.15,1);
  }
  .roulette-pin{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent;
    border-top:20px solid var(--accent); filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .roulette-hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:20%; height:20%; border-radius:50%; background:var(--surface); border:3px solid var(--ink);
  }
  .legend{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-size:12.5px; }
  .legend-item{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .wealth-ticker{
    font-family:var(--font-mono); font-weight:700; font-size:clamp(20px,5vw,28px);
    padding:10px 20px; border-radius:var(--radius-sm); background:var(--surface-2);
    border:2px solid var(--surface-border); min-width:220px; text-align:center;
  }
  .wealth-ticker.rolling{ border-style:dashed; }
  .wealth-ticker.landed{ animation:popScale .4s cubic-bezier(.3,1.6,.4,1); border-style:solid; border-color:currentColor; }
  @keyframes popScale{ 0%{ transform:scale(0.85);} 60%{ transform:scale(1.08);} 100%{ transform:scale(1);} }

  .dice-row{ display:flex; gap:14px; align-items:center; justify-content:center; margin:10px 0; }
  .die{
    width:56px; height:56px; border-radius:12px; background:var(--surface); border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:var(--shadow-sm);
  }
  .die.rolling{ animation:roll .12s linear infinite; }
  @keyframes roll{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

  .reveal-card{
    border:2px dashed var(--surface-border); border-radius:var(--radius-md); padding:18px;
    background:var(--surface-2); margin-top:8px; animation:flipIn .5s ease;
  }
  @keyframes flipIn{ from{ opacity:0; transform:rotateX(35deg);} to{ opacity:1; transform:rotateX(0);} }

  .quiz-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .timer{
    font-family:var(--font-mono); font-weight:700; font-size:15px; padding:6px 12px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--surface-border);
  }
  .timer.low{ color:var(--bad); border-color:var(--bad); }
  .quiz-progress{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }
  .quiz-prompt{ font-size:17px; font-weight:700; margin:6px 0 14px; }
  .quiz-option{ width:100%; }
  .quiz-option.correct{ border-color:var(--good); background:color-mix(in srgb, var(--good) 16%, var(--surface-2)); }
  .quiz-option.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 16%, var(--surface-2)); }
  .explain-box{ margin-top:12px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--cap-info-soft); color:var(--ink); font-size:14px; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin:10px 0; }
  .net-card{ border-radius:var(--radius-md); padding:14px; border:2px solid var(--surface-border); background:var(--surface-2); transition:transform .2s ease; }
  .net-card .rarity{ font-size:11px; font-weight:800; letter-spacing:.05em; }
  .rarity-common{ color: var(--ink-faint); }
  .rarity-rare{ color: var(--cap-social); }
  .rarity-epic{ color: var(--accent); }
  .net-card-rare{ border-color:var(--cap-social); box-shadow:0 0 0 1px var(--cap-social) inset; }
  .net-card-epic{
    border-color:var(--accent);
    background:linear-gradient(155deg, var(--accent-soft) 0%, var(--surface-2) 55%);
    box-shadow:var(--shadow-sm), 0 0 0 1px var(--accent) inset;
  }
  .net-card-rare:hover, .net-card-epic:hover{ transform:translateY(-3px); }

  .event-card{ border-left:5px solid var(--surface-border); background:var(--surface-2); border-radius:var(--radius-sm); padding:14px 16px; margin:10px 0; }
  .event-card.good{ border-left-color:var(--good); }
  .event-card.bad{ border-left-color:var(--bad); }
  .event-title{ font-weight:800; margin-bottom:4px; }
  .delta{ font-family:var(--font-mono); font-weight:700; }
  .delta.pos{ color:var(--good); }
  .delta.neg{ color:var(--bad); }

  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .badge-pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12.5px;
    border:1px solid var(--accent);
  }

  .toast-zone{ position:fixed; top:16px; right:16px; z-index:80; display:flex; flex-direction:column; gap:8px; max-width:min(320px,86vw); }
  .toast{
    background:var(--ink); color:var(--surface); padding:11px 15px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:700; box-shadow:var(--shadow); animation:toastIn .35s ease, toastOut .35s ease 2.6s forwards;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);} }
  @keyframes toastOut{ to{opacity:0; transform:translateX(20px);} }

  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
  .confetti i{ position:absolute; top:-12px; width:8px; height:14px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0; } }

  .diagram{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:16px 0; justify-content:center; }
  .diagram-box{ border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; font-weight:800; text-align:center; border:2px solid; min-width:110px; }
  .diagram-arrow{ font-size:20px; color:var(--ink-faint); }

  details.panel{ border:1px solid var(--surface-border); border-radius:var(--radius-md); background:var(--surface-2); padding:4px 16px; margin:10px 0; }
  details.panel > summary{ cursor:pointer; font-weight:800; padding:12px 0; list-style:none; display:flex; align-items:center; gap:8px; }
  details.panel > summary::-webkit-details-marker{ display:none; }
  details.panel > summary::before{ content:'▸'; transition:transform .2s; }
  details.panel[open] > summary::before{ transform:rotate(90deg); }
  details.panel .panel-body{ padding-bottom:16px; font-size:14px; color:var(--ink-soft); }
  details.panel .panel-body h4{ color:var(--ink); margin:14px 0 6px; font-size:14px; }
  details.panel .panel-body ul{ margin:6px 0; padding-left:20px; }
  details.panel .panel-body li{ margin:4px 0; }

  .avatar-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(50px,1fr)); gap:8px; margin:10px 0 18px; }
  .avatar-opt{
    font-size:26px; padding:10px 0; text-align:center; border-radius:var(--radius-sm);
    border:2px solid var(--surface-border); background:var(--surface-2); cursor:pointer;
  }
  .avatar-opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .field{ margin:10px 0 18px; }
  .field label{ display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; max-width:320px; padding:10px 12px; border-radius:var(--radius-sm);
    border:2px solid var(--surface-border); background:var(--surface); color:var(--ink); font-size:15px; font-family:inherit;
  }
  .field input:focus-visible{ outline:3px solid var(--accent); outline-offset:1px; }

  .final-hero{ text-align:center; padding:8px 0 6px; }
  .final-title{ font-size:clamp(24px,5vw,36px); margin:6px 0; }
  .mobility-pill{ display:inline-block; padding:8px 16px; border-radius:999px; font-weight:800; margin:8px 0; }
  .mobility-up{ background:var(--cap-culture-soft); color:var(--cap-culture); }
  .mobility-down{ background:var(--cap-info-soft); color:var(--cap-info); }
  .mobility-flat{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--surface-border); }

  table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:10px 0; }
  table.data-table th, table.data-table td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--surface-border); }
  table.data-table th{ color:var(--ink-soft); font-weight:700; }
  .table-wrap{ overflow-x:auto; }

  .footer-note{ text-align:center; color:var(--ink-faint); font-size:12px; margin-top:26px; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hud hud-hide" id="hud"></div>
  <div class="stepper hud-hide" id="stepper"></div>
  <main id="stage-root" class="stage-card" aria-live="polite"></main>
  <p class="footer-note">인생게임: 아비투스 &middot; 통합사회 수업용 사회 이동 시뮬레이션 &middot; 모든 수치는 교육적 예시이며 실제 통계와 다를 수 있습니다</p>
</div>
<div class="toast-zone" id="toastZone"></div>
<div class="confetti" id="confettiZone"></div>

<script>
/* =========================================================
   인생게임: 아비투스 — game data & engine
   ========================================================= */
"use strict";

/* ---------- utils ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
/* Amounts are stored in 만원(10,000-won) units throughout. Once a value
   crosses 1억(=10,000만원) this renders it as "N억 [M만원]" the way a
   Korean speaker would actually say it, instead of a long raw 만원 figure. */
function won(n){
  const neg = n < 0;
  n = Math.round(Math.abs(n));
  const eok = Math.floor(n / 10000);
  const man = n % 10000;
  let s;
  if(eok > 0 && man > 0) s = `${eok.toLocaleString('ko-KR')}억 ${man.toLocaleString('ko-KR')}만원`;
  else if(eok > 0) s = `${eok.toLocaleString('ko-KR')}억원`;
  else s = `${man.toLocaleString('ko-KR')}만원`;
  return (neg ? '-' : '') + s;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function weightedPick(items){
  const total = items.reduce((s,i)=>s+i.weight,0);
  let r = Math.random()*total;
  for(const it of items){ if(r < it.weight) return it; r -= it.weight; }
  return items[items.length-1];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   engine: state
   ========================================================= */
const AVATARS = ['🧑','👩','🧑‍🦱','👩‍🦳','🧕','🧑‍🦲'];
const STAGE_ORDER = ['roulette','childhood','infogap','prep','csat','network','ncs'];
const STAGE_LABEL = { roulette:'출생', childhood:'유년기', infogap:'정보격차', prep:'입시투자', csat:'수능', network:'네트워크', ncs:'취업' };

/* `game` orchestrates the classroom flow across several 조(teams): each team
   plays phase 1 (roulette→...→ncs) in turn, then all teams draft careers in
   score order, then a class-wide ranking is shown. A solo player is simply
   totalTeams===1, which degenerates gracefully to one continuous playthrough. */
var game = null; // intentionally `var` so it is inspectable as window.game from the console
function freshGame(){ return { totalTeams:1, teams:[], careerPool:[], draftOrder:[], draftPointer:0 }; }

var state = null; // intentionally `var` (not `let`) so it is inspectable as window.state from the console
function freshState(teamNum){
  return {
    teamNum: teamNum||1, teamName:`${teamNum||1}조`, avatar:AVATARS[0],
    tier:null, siblings:0, startCashActual:0,
    cash:0, stats:{culture:0,social:0,info:0}, hints:0,
    missionsChosen:[],
    infoResults:[],
    prepTier:null,
    csatQueue:[], csatIndex:0, csatCorrect:0, csatTotal:0,
    universityTier:null,
    cards:[],
    ncsQueue:[], ncsIndex:0, ncsCorrect:0, ncsTotal:0,
    draftScore:0, diceTiebreak:0,
    career:null,
    eventLog:[],
    finalTierId:null, badges:[],
  };
}
function startTeamTurn(teamNum){
  state = freshState(teamNum);
  goStage('teamstart');
}

/* ---------- small helpers ---------- */
function toast(msg){
  const zone = $('#toastZone');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  zone.appendChild(el);
  setTimeout(()=> el.remove(), 3000);
}
function confettiBurst(n=26){
  const zone = $('#confettiZone');
  const colors = ['var(--accent)','var(--cap-econ)','var(--cap-culture)','var(--cap-social)','var(--cap-info)'];
  for(let i=0;i<n;i++){
    const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'vw';
    s.style.background = pick(colors);
    s.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    s.style.animationDelay = (Math.random()*0.4)+'s';
    s.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    zone.appendChild(s);
    setTimeout(()=> s.remove(), 3400);
  }
}
function addCash(n){ state.cash = Math.round(state.cash + n); }
/* How big a cost looks relative to the family's current total wealth — the
   same 100만원 tuition bill is "0.01%, doesn't matter" for a diamond family
   and "10%, a real sacrifice" for a soil family. Shown next to costs so the
   gap is felt at every purchase decision, not just on the roulette screen. */
function pctOfWealth(cost, pool){
  const base = pool!=null ? pool : state.cash;
  if(base<=0) return '—';
  const pct = (cost/base)*100;
  if(pct < 0.01) return '<0.01%';
  if(pct < 1) return pct.toFixed(2)+'%';
  if(pct < 10) return pct.toFixed(1)+'%';
  return Math.round(pct)+'%';
}
/* Endgame tier thresholds sit well BELOW their matching starting tier
   (see SES_TIERS above), on purpose: three life-event rounds of salary and
   quiz bonuses can only add up to roughly a few thousand 만원, which is
   nothing against a silver/gold/diamond starting pool — so the rich reliably
   stay classified in (or near) their starting tier no matter what they do.
   For soil/bronze starters, that same few-thousand swing is comparable to or
   bigger than their whole starting pool, so it can visibly move them up one
   tier — rarely two — which is the intended "mobility exists, but has a
   ceiling" shape. */
function tierForCash(cash){
  if(cash>=250000) return 'diamond';
  if(cash>=50000) return 'gold';
  if(cash>=9000) return 'silver';
  if(cash>=2000) return 'bronze';
  return 'soil';
}
function awardBadgesInline(){
  const before = new Set(state.badges.map(b=>b.id));
  const now = BADGES.filter(b=> b.cond(state));
  now.forEach(b=>{ if(!before.has(b.id)) { state.badges.push(b); } });
}

/* ---------- HUD & stepper ---------- */
const HUD_HIDDEN_STAGES = new Set(['title','teamsetup','draftboard','ranking']);
function renderHud(){
  const hud = $('#hud');
  if(!state || !state.tier || HUD_HIDDEN_STAGES.has(currentStage)){ hud.classList.add('hud-hide'); return; }
  hud.classList.remove('hud-hide');
  const teamProgress = game && game.totalTeams>1 ? `<span class="hud-name">${game.teams.length+1}/${game.totalTeams}조 진행 중</span>` : '';
  hud.innerHTML = `
    <span class="hud-id"><span class="hud-avatar">${state.avatar}</span><span>${escapeHtml(state.teamName)}</span></span>
    <span class="hud-name">${state.tier.name}</span>
    ${teamProgress}
    <span class="hud-stats">
      <span class="chip chip-cash">💰 ${won(state.cash)}</span>
      <span class="chip chip-culture">📚 문화 ${state.stats.culture}</span>
      <span class="chip chip-social">🤝 사회 ${state.stats.social}</span>
      <span class="chip chip-info">🛰️ 정보 ${state.stats.info}</span>
      ${state.hints>0 ? `<span class="chip chip-econ">💡 힌트 ${state.hints}</span>` : ''}
    </span>`;
}
function renderStepper(){
  const el = $('#stepper');
  if(!state || !state.tier || !STAGE_ORDER.includes(currentStage)){ el.classList.add('hud-hide'); return; }
  el.classList.remove('hud-hide');
  const idx = STAGE_ORDER.indexOf(currentStage);
  el.innerHTML = STAGE_ORDER.map((s,i)=>{
    const cls = i<idx ? 'done' : (i===idx ? 'now':'');
    return `<span class="step-dot ${cls}" title="${STAGE_LABEL[s]}"></span>`;
  }).join('');
}

/* ---------- navigation ---------- */
var currentStage = 'title';
const RENDERERS = {};
function goStage(name){
  currentStage = name;
  renderHud(); renderStepper();
  RENDERERS[name]();
  window.scrollTo({top:0, behavior:'smooth'});
}

      ${AVATARS.map((a,i)=>`<button type="button" class="avatar-opt ${i===0?'selected':''}" data-i="${i}">${a}</button>`).join('')}
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="btnRoll">🎡 운명의 룰렛 돌리러 가기</button></div>`;
  let avatarIdx = 0;
  $$('.avatar-opt').forEach(b=> b.addEventListener('click', ()=>{
    $$('.avatar-opt').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected'); avatarIdx = Number(b.dataset.i);
  }));
  $('#btnRoll').addEventListener('click', ()=>{
    const nick = $('#nickInput').value.trim();
    state.teamName = nick || `${state.teamNum}조`;
    state.avatar = AVATARS[avatarIdx];
    goStage('roulette');
  });
};

/* =========================================================
   stage: roulette (birth SES) + sibling dice
   ========================================================= */
RENDERERS.roulette = function(){
  const total = SES_TIERS.reduce((s,t)=>s+t.weight,0);
  let cum = 0;
  const stops = SES_TIERS.map(t=>{ const start = cum/total*360; cum += t.weight; const end = cum/total*360; return {t,start,end}; });
  const gradient = stops.map(s=> `${s.t.color} ${s.start}deg ${s.end}deg`).join(', ');

  $('#stage-root').innerHTML = `
    <span class="eyebrow">STEP 1 · 출생 룰렛</span>
    <h2 class="stage-title display">어떤 가문에서 태어날까요?</h2>
    <p class="stage-desc">현실의 자산 분포를 단순화해 반영한 확률입니다. 버튼을 눌러 룰렛을 돌려보세요.</p>
    <div class="roulette-zone">
      <div class="roulette-wrap">
        <div class="roulette-pin"></div>
        <div class="roulette-wheel" id="wheel" style="background:conic-gradient(${gradient})"></div>
        <div class="roulette-hub"></div>
      </div>
      <div class="legend">
        ${SES_TIERS.map(t=>`<span class="legend-item"><span class="legend-dot" style="background:${t.color}"></span>${t.name} ${t.weight}%</span>`).join('')}
      </div>
      <div id="wealthTicker" class="wealth-ticker">?</div>
      <button class="btn btn-primary" id="btnSpin">🎡 룰렛 돌리기</button>
    </div>
    <div id="rouletteResult"></div>`;

  $('#btnSpin').addEventListener('click', function(){
    this.disabled = true;
    const result = weightedPick(SES_TIERS);
    const stop = stops.find(s=> s.t.id===result.id);
    const targetAngle = (stop.start+stop.end)/2;
    const rotation = 360*5 + (360-targetAngle);
    const wheel = $('#wheel');
    wheel.style.transform = `rotate(${rotation}deg)`;

    const ticker = $('#wealthTicker');
    ticker.classList.add('rolling');
    let ticks = 0;
    const tickHandle = setInterval(()=>{
      const t = pick(SES_TIERS);
      ticker.textContent = won(t.startCash);
      ticker.style.color = t.color;
      ticks++;
    }, 80);

    setTimeout(()=>{ clearInterval(tickHandle); revealBirth(result); }, 3300);
  });

  function revealBirth(tier){
    state.tier = tier;
    state.cash = tier.startCash;
    state.stats = { culture:tier.culture, social:tier.social, info:tier.info };
    renderHud();
    const ticker = $('#wealthTicker');
    ticker.classList.remove('rolling');
    ticker.classList.add('landed');
    ticker.textContent = `당첨! ${won(tier.startCash)}`;
    ticker.style.color = tier.color;
    const burstSize = { diamond:60, gold:44, silver:26, bronze:10, soil:0 }[tier.id];
    if(burstSize>0) confettiBurst(burstSize);
    $('#rouletteResult').innerHTML = `
      <div class="reveal-card">
        <div class="eyebrow" style="color:${tier.color}">🏠 ${tier.name}</div>
        <p style="margin:4px 0 10px"><b>부모 직업</b> ${tier.parentJob} &middot; <b>거주 환경</b> ${tier.home}</p>
        <p style="margin:0 0 14px;color:var(--ink-soft)">${tier.flavor}</p>
        <div class="dice-row">
          <div class="die" id="die">🎲</div>
          <div id="diceText" style="font-weight:700">형제자매 수를 굴려볼까요?</div>
        </div>
        <div class="btn-row"><button class="btn" id="btnDice">주사위 굴리기</button></div>
      </div>`;
    $('#btnDice').addEventListener('click', function(){
      this.disabled = true;
      const die = $('#die');
      die.classList.add('rolling');
      const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
      let t = 0;
      const roll = setInterval(()=>{ die.textContent = pick(faces); t++; if(t>10){ clearInterval(roll); finishDice(); } }, 80);
    });
  }

  function finishDice(){
    const roll = 1+Math.floor(Math.random()*6);
    const siblings = Math.max(0, roll-3);
    state.siblings = siblings;
    if(siblings>0){
      const before = state.cash;
      state.cash = Math.round(state.cash * (1 - 0.06*siblings));
      toast(`형제자매 ${siblings}명과 자원을 나눠, 시작 자산이 ${won(before-state.cash)} 줄었습니다.`);
    }
    state.startCashActual = state.cash; // snapshot right after birth, before any spending — used for the "다른 가문이었다면" comparison at the end
    renderHud();
    $('#die').classList.remove('rolling');
    $('#die').textContent = '🎲';
    $('#diceText').innerHTML = siblings===0
      ? '외동입니다. 부모님의 자원을 온전히 물려받습니다.'
      : `형제자매가 <b>${siblings}명</b> 있습니다. 자원을 나누어 써야 합니다.`;
    $('#stage-root').insertAdjacentHTML('beforeend', `
      <div class="btn-row">
        <button class="btn btn-primary" id="btnToChild">다음: 유년기로 →</button>
      </div>`);
    $('#btnToChild').addEventListener('click', ()=> goStage('childhood'));
  }
};

/* =========================================================
   stage: childhood missions (문화자본 미션 보드)
   ========================================================= */
RENDERERS.childhood = function(){
  const MAX_SLOTS = 3;
  let chosen = [];

  function affordable(m){ return state.cash - spentTotal() >= m.cost; }
  function spentTotal(){ return chosen.reduce((s,id)=> s + CHILD_MISSIONS.find(m=>m.id===id).cost, 0); }

  function draw(){
    $('#stage-root').innerHTML = `
      <span class="eyebrow">STEP 2 · 유년기</span>
      <h2 class="stage-title display">문화자본 미션 보드</h2>
      <p class="stage-desc">시간 슬롯은 3개뿐입니다. 지금 가진 ${won(state.cash)} 안에서 최대 3가지를 골라보세요. (무료 항목도 있어요)</p>
      <div class="mission-slots">${Array.from({length:MAX_SLOTS}).map((_,i)=>`<span class="slot ${i<chosen.length?'used':''}"></span>`).join('')}</div>
      <div class="choice-grid" id="missionGrid">
        ${CHILD_MISSIONS.map(m=>{
          const sel = chosen.includes(m.id);
          const dis = !sel && (chosen.length>=MAX_SLOTS || !affordable(m));
          return `<button type="button" class="choice-card ${sel?'selected':''}" data-id="${m.id}" ${dis?'disabled':''}>
            <span class="choice-title">${m.title}</span>
            <span class="choice-meta">
              <span class="tag">${m.cost>0?won(m.cost):'무료'}</span>
              ${m.cost>0?`<span class="tag">가문 자산의 ${pctOfWealth(m.cost, state.cash)}</span>`:''}
              <span class="tag">문화자본 +${m.culture}</span>
              ${m.info>0?`<span class="tag">정보력 +${m.info}</span>`:''}
            </span>
            <span class="choice-meta">${m.note}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="btnNext">다음: 정보격차 이벤트 →</button></div>`;

    $$('#missionGrid .choice-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        if(chosen.includes(id)){ chosen = chosen.filter(x=>x!==id); }
        else if(chosen.length<MAX_SLOTS && affordable(CHILD_MISSIONS.find(m=>m.id===id))){ chosen.push(id); }
        draw();
      });
    });
    $('#btnNext').addEventListener('click', ()=>{
      chosen.forEach(id=>{
        const m = CHILD_MISSIONS.find(x=>x.id===id);
        addCash(-m.cost);
        state.stats.culture = clamp(state.stats.culture + m.culture, 0, 100);
        state.stats.info = clamp(state.stats.info + m.info, 0, 100);
      });
      state.missionsChosen = chosen;
      renderHud();
      goStage('infogap');
    });
  }
  draw();
};

/* =========================================================
   stage: info gap events (정보격차)
   ========================================================= */
RENDERERS.infogap = function(){
  const events = shuffle(INFO_EVENTS).slice(0,3);
  const results = events.map(ev=>{
    const has = state.stats[ev.need] >= ev.threshold;
    if(has){
      if(ev.have.hint) state.hints += ev.have.hint;
      if(ev.have.cash) addCash(ev.have.cash);
    }
    return { ev, has };
  });
  state.infoResults = results;
  renderHud();

  $('#stage-root').innerHTML = `
    <span class="eyebrow">STEP 3 · 정보격차</span>
    <h2 class="stage-title display">정보는 공평하게 오지 않습니다</h2>
    <p class="stage-desc">가진 정보력·사회자본에 따라 같은 기회도 다르게 다가옵니다.</p>
    ${results.map(r=>`
      <div class="event-card ${r.has?'good':'bad'}">
        <div class="event-title">${r.has ? '✅ 기회를 포착했습니다' : '❌ 기회를 놓쳤습니다'}</div>
        <p style="margin:0">${r.has ? r.ev.have.text : r.ev.miss.text}</p>
      </div>`).join('')}
    <div class="btn-row"><button class="btn btn-primary" id="btnNext">다음: 입시 투자 →</button></div>`;
  $('#btnNext').addEventListener('click', ()=> goStage('prep'));
};

/* =========================================================
   stage: exam prep investment
   ========================================================= */
RENDERERS.prep = function(){
  let chosenId = null;
  function draw(){
    $('#stage-root').innerHTML = `
      <span class="eyebrow">STEP 4 · 입시 투자</span>
      <h2 class="stage-title display">수능 준비, 어떻게 하시겠어요?</h2>
      <p class="stage-desc">지금 가진 돈은 ${won(state.cash)}입니다. 투자할수록 힌트와 점수 배율이 커집니다.</p>
      <div class="choice-grid">
        ${PREP_TIERS.map(p=>{

          const sel = chosenId===p.id;
          return `<button type="button" class="choice-card ${sel?'selected':''}" data-id="${p.id}" ${dis?'disabled':''}>
            <span class="choice-title">${p.name}${p.exclusive?' 🔒':''}</span>
            <span class="choice-meta">
              <span class="tag">${p.cost>0?won(p.cost):'무료'}</span>
              ${p.cost>0?`<span class="tag">가문 자산의 ${pctOfWealth(p.cost, state.cash)}</span>`:''}
              <span class="tag">힌트 ${p.hints}개</span><span class="tag">배율 ×${p.mult.toFixed(2)}</span>
            </span>
            <span class="choice-meta">${p.desc}${p.exclusive && dis ? ' (가문 자산이 부족해 이 선택지 자체가 보이지 않는 사람도 있습니다)' : ''}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="btnNext" ${chosenId?'':'disabled'}>다음: 수능 미니게임 →</button></div>`;

    $('#btnNext').addEventListener('click', ()=>{

      addCash(-tier.cost);

      renderHud();
      goStage('csat');

/* =========================================================
   shared: quiz engine (used by csat & ncs stages)
   ========================================================= */
const QUIZ_CFG = {
  csat: { bank:CSAT_BANK, n:5, time:25, title:'수능 미니게임 · 통합사회', eyebrow:'STEP 5 · 수능', next:'network',
    intro:'문제은행에서 무작위로 5문항이 출제됩니다. 힌트는 오답 하나를 지워줍니다.' },
  ncs:  { bank:NCS_BANK,  n:5, time:30, title:'NCS 미니게임 · 직업기초능력', eyebrow:'STEP 7 · 취업', next:null,
    intro:'수리·문제해결·자원관리·의사소통 영역에서 무작위 출제됩니다.' },
};
let quizTimerHandle = null;
function stopQuizTimer(){ if(quizTimerHandle){ clearInterval(quizTimerHandle); quizTimerHandle=null; } }

function startQuiz(kind){
  const cfg = QUIZ_CFG[kind];
  state[kind+'Queue'] = shuffle(cfg.bank).slice(0, cfg.n);
  state[kind+'Index'] = 0;
  state[kind+'Correct'] = 0;
  state[kind+'Total'] = cfg.n;
  renderQuizQuestion(kind);
}

function renderQuizQuestion(kind){
  stopQuizTimer();
  const cfg = QUIZ_CFG[kind];
  const queue = state[kind+'Queue'];
  const idx = state[kind+'Index'];
  if(idx >= queue.length){ finishQuiz(kind); return; }
  const q = queue[idx];
  let removedWrong = [];
  let timeLeft = cfg.time;
  let answered = false;

  $('#stage-root').innerHTML = `
    <span class="eyebrow">${cfg.eyebrow}</span>
    <h2 class="stage-title display">${cfg.title}</h2>
    <div class="quiz-head">
      <span class="quiz-progress">${idx+1} / ${queue.length} 문항 &middot; <span class="tag">${q.cat}</span></span>
      <span class="timer mono" id="timer">${timeLeft}s</span>
    </div>
    <p class="quiz-prompt">${escapeHtml(q.q)}</p>
    <div class="choice-grid" id="optGrid">
      ${q.choices.map((c,i)=>`<button type="button" class="choice-card quiz-option" data-i="${i}">${String.fromCharCode(9312+i)} ${escapeHtml(c)}</button>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn btn-sm" id="btnHint" ${state.hints>0?'':'disabled'}>💡 힌트 사용 (${state.hints}개 남음)</button>
    </div>
    <div id="quizFooter"></div>`;

  function lockAndReveal(chosenIdx, timedOut){
    if(answered) return;
    answered = true;
    stopQuizTimer();
    const correct = chosenIdx === q.answer;
    if(correct) state[kind+'Correct']++;
    $$('#optGrid .quiz-option').forEach((btn,i)=>{
      btn.disabled = true;
      if(i===q.answer) btn.classList.add('correct');
      else if(i===chosenIdx) btn.classList.add('wrong');
    });
    $('#btnHint').disabled = true;
    let speedNote = '';
    if(correct && !timedOut){
      const bonus = Math.round((timeLeft/cfg.time) * 8);
      if(bonus>0){ addCash(bonus); renderHud(); speedNote = ` (스피드 보너스 +${won(bonus)})`; }
    }
    $('#quizFooter').innerHTML = `
      <div class="explain-box">
        <b>${timedOut ? '⏰ 시간 초과!' : (correct ? '✅ 정답입니다!'+speedNote : '❌ 오답입니다.')}</b><br>${escapeHtml(q.explain)}
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="btnNextQ">${idx+1<queue.length?'다음 문제 →':'결과 확인 →'}</button></div>`;
    $('#btnNextQ').addEventListener('click', ()=>{ state[kind+'Index']++; renderQuizQuestion(kind); });
  }

  $$('#optGrid .quiz-option').forEach(btn=>{
    btn.addEventListener('click', ()=> lockAndReveal(Number(btn.dataset.i), false));
  });
  $('#btnHint').addEventListener('click', ()=>{
    if(state.hints<=0 || answered) return;
    const wrongLeft = $$('#optGrid .quiz-option').map((b,i)=>i).filter(i=> i!==q.answer && !removedWrong.includes(i));
    if(wrongLeft.length===0) return;
    const kill = pick(wrongLeft);
    removedWrong.push(kill);
    state.hints--;
    const btn = $(`#optGrid .quiz-option[data-i="${kill}"]`);
    btn.disabled = true; btn.style.opacity = '0.3'; btn.style.textDecoration='line-through';
    renderHud();
    $('#btnHint').textContent = `💡 힌트 사용 (${state.hints}개 남음)`;
    if(state.hints<=0) $('#btnHint').disabled = true;
  });

  quizTimerHandle = setInterval(()=>{
    timeLeft--;
    const t = $('#timer');
    if(t){ t.textContent = timeLeft+'s'; if(timeLeft<=8) t.classList.add('low'); }
    if(timeLeft<=0){ lockAndReveal(-1, true); }
  }, 1000);
}

function finishQuiz(kind){
  stopQuizTimer();
  const cfg = QUIZ_CFG[kind];
  const correct = state[kind+'Correct'];
  const total = state[kind+'Total'];
  awardBadgesInline();
  let extra = '';
  if(kind==='csat'){
    const weighted = correct * (state.prepTier ? state.prepTier.mult : 1);
    let uni;
    if(weighted>=5.5) uni = {label:'최상위권 대학', tier:3};
    else if(weighted>=4) uni = {label:'상위권 대학', tier:2};
    else if(weighted>=2.5) uni = {label:'중위권 대학', tier:1};
    else uni = {label:'전문대 / 재도전', tier:0};
    state.universityTier = uni;
    extra = `<p style="margin-top:10px">준비 배율(×${(state.prepTier?state.prepTier.mult:1).toFixed(2)})을 반영한 결과, <b>${uni.label}</b>에 진학했습니다.</p>`;
  } else {
    extra = `<p style="margin-top:10px">이 점수는 진로 드래프트에서 순위 산정에 반영됩니다.</p>`;
  }
  $('#stage-root').innerHTML = `
    <span class="eyebrow">${cfg.eyebrow}</span>
    <h2 class="stage-title display">${kind==='csat'?'수능 결과':'NCS 결과'}</h2>
    <p class="stage-desc">${cfg.bank===CSAT_BANK?'통합사회':'직업기초능력'} 문제은행에서 <b>${correct} / ${total}</b>문항을 맞혔습니다.</p>
    ${extra}
    <div class="btn-row"><button class="btn btn-primary" id="btnNext">계속하기 →</button></div>`;
  $('#btnNext').addEventListener('click', ()=>{
    if(cfg.next) goStage(cfg.next);
    else finishPhase1ForTeam();
  });
}

RENDERERS.csat = function(){ startQuiz('csat'); };
RENDERERS.ncs = function(){ startQuiz('ncs'); };

/* =========================================================
   stage: campus network cards
   ========================================================= */
const NET_DRAW_BY_TIER = [
  { draws:1, weights:{common:85, rare:15, epic:0} },
  { draws:2, weights:{common:65, rare:30, epic:5} },
  { draws:3, weights:{common:40, rare:40, epic:20} },
  { draws:4, weights:{common:20, rare:40, epic:40} },
];
RENDERERS.network = function(){
  const uniTier = state.universityTier ? state.universityTier.tier : 0;
  const cfgD = NET_DRAW_BY_TIER[uniTier];
  const pool = { common:NETWORK_CARDS.filter(c=>c.rarity==='common'), rare:NETWORK_CARDS.filter(c=>c.rarity==='rare'), epic:NETWORK_CARDS.filter(c=>c.rarity==='epic') };
  const drawn = [];
  for(let i=0;i<cfgD.draws;i++){
    const roll = Math.random()*100;
    let rarity = 'common';
    if(roll < cfgD.weights.epic) rarity = 'epic';
    else if(roll < cfgD.weights.epic + cfgD.weights.rare) rarity = 'rare';
    const options = pool[rarity].filter(c=> !drawn.some(d=>d.id===c.id));
    drawn.push(pick(options.length? options : pool[rarity]));
  }
  drawn.forEach(c=>{
    state.cards.push({...c, used:false}); // clone — NETWORK_CARDS entries are shared across teams, so
                                           // per-team "used" flags must live on a private copy, not the master object
    if(c.hint) state.hints += c.hint;
  });
  renderHud();
  awardBadgesInline();

  $('#stage-root').innerHTML = `
    <span class="eyebrow">STEP 6 · 대학 네트워크</span>
    <h2 class="stage-title display">캠퍼스에서 얻은 인맥</h2>
    <p class="stage-desc">${state.universityTier?state.universityTier.label:'대학'} 진학 결과, 인맥 카드 ${drawn.length}장을 뽑았습니다. 대학 등급이 높을수록 희귀한 인맥을 만날 확률이 커집니다.</p>
    <div class="card-grid">
      ${drawn.map(c=>`
        <div class="net-card net-card-${c.rarity}">
          <div class="rarity rarity-${c.rarity}">${c.rarity==='epic'?'★ EPIC':c.rarity==='rare'?'◆ RARE':'· COMMON'}</div>
          <div class="choice-title">${c.name}</div>
          <div class="choice-meta">${c.effect}</div>
        </div>`).join('')}
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="btnNext">다음: 취업 NCS 미니게임 →</button></div>`;
  $('#btnNext').addEventListener('click', ()=> goStage('ncs'));
};

/* =========================================================
   phase-1 → phase-2 handoff: called once a team finishes the
   NCS quiz. Either send the next 조 into phase 1, or — once every
   조 is done — compute the cross-team draft order.
   ========================================================= */
function finishPhase1ForTeam(){
  game.teams.push(state);
  if(game.teams.length < game.totalTeams){
    goStage('teaminterstitial');
  } else {
    computeDraftOrder();
    goStage('draftboard');
  }
}
RENDERERS.teaminterstitial = function(){
  const doneNum = game.teams.length;
  $('#stage-root').innerHTML = `

    <div class="btn-row"><button class="btn btn-primary" id="btnNext">${doneNum+1}조 시작하기 →</button></div>`;

function computeDraftOrder(){
  game.teams.forEach(t=>{
    const uniBonus = { 0:0, 1:10, 2:20, 3:30 }[t.universityTier?t.universityTier.tier:0];
    const cardBonus = t.cards.reduce((s,c)=> s + c.jobBonus, 0);
    t.draftScore = Math.round(t.ncsCorrect*10 + uniBonus + cardBonus);
    t.diceTiebreak = 1 + Math.floor(Math.random()*6);
  });
  game.draftOrder = game.teams.map((t,i)=>i).sort((a,b)=>{
    const ta = game.teams[a], tb = game.teams[b];
    return (tb.draftScore - ta.draftScore) || (tb.diceTiebreak - ta.diceTiebreak);
  });
  game.draftPointer = 0;
  game.careerPool = [...CAREERS];
}

/* =========================================================
   stage: life events (인생 이벤트, 3 rounds) — runs once per
   team right after that team drafts a career
   ========================================================= */
const ROUND_LABEL = ['청년기 (20대 후반)', '장년기 (30대)', '중년기 (40대)'];
RENDERERS.events = function(){
  const deck = shuffle(LIFE_EVENTS).slice(0,3);
  let round = 0;

  function draw(){
    if(round >= 3){
      $('#stage-root').innerHTML = `
        <span class="eyebrow">STEP 9 · 인생 이벤트</span>
        <h2 class="stage-title display">세 번의 굴곡을 지나왔습니다</h2>
        <p class="stage-desc">${state.teamName}의 선택과 운을 모두 반영해 정산할 차례입니다.</p>
        <div class="btn-row"><button class="btn btn-primary" id="btnNext">정산 결과 보기 →</button></div>`;
      $('#btnNext').addEventListener('click', ()=> goStage('teamsettle'));
      return;
    }
    const ev = deck[round];
    const income = state.career.salary;
    addCash(income);
    renderHud();

    function resolveOutcome(opts){
      if(opts.cost) addCash(-opts.cost);
      addCash(opts.delta);
      const mitigated = ev.type==='bad' ? opts.reduced : !opts.reduced;
      state.eventLog.push({ id:ev.id, title:ev.title, type:ev.type, mitigated, delta:opts.delta });
      renderHud();
      const outcomeGood = ev.type==='bad' ? opts.reduced : !opts.reduced;
      const title = opts.titleOverride || (ev.type==='bad'
        ? (opts.reduced?'🛡️ 위기를 방어했습니다':'⚠️ 위기가 닥쳤습니다')
        : (opts.reduced?'🌤️ 기회를 다 살리지 못했습니다':'🍀 좋은 일이 생겼습니다'));
      $('#stage-root').innerHTML = `
        <span class="eyebrow">STEP 9 · 인생 이벤트 · ${ROUND_LABEL[round]}</span>
        <h2 class="stage-title display">${ev.title}</h2>
        <div class="event-card good">
          <div class="event-title">💼 ${state.career.name} 소득</div>
          <p style="margin:0">이번 시기 소득으로 <span class="delta pos">+${won(income)}</span>가 쌓였습니다.</p>
        </div>
        ${opts.cost ? `<div class="event-card">
          <div class="event-title">🎯 ${opts.costLabel}</div>
          <p style="margin:0"><span class="delta neg">-${won(opts.cost)}</span> 투입했습니다.</p>
        </div>` : ''}
        <div class="event-card ${outcomeGood?'good':'bad'}">
          <div class="event-title">${title}</div>
          <p style="margin:0 0 6px">${opts.narrative}</p>
          <span class="delta ${opts.delta>=0?'pos':'neg'}">${opts.delta>=0?'+':''}${won(opts.delta)}</span>
        </div>
        <div class="btn-row"><button class="btn btn-primary" id="btnNext">다음 →</button></div>`;
      $('#btnNext').addEventListener('click', ()=>{ round++; draw(); });
    }

    const passiveReduced = ev.mitigate(state);
    const passiveIsBest = ev.type==='bad' ? passiveReduced : !passiveReduced;
    const active = ACTIVE_RESPONSES[ev.id];

    // Background already gave the best possible outcome here (or this event has
    // no active response defined), so spending capital would change nothing —
    // resolve it silently, the same way it always has.
    if(passiveIsBest || !active){
      const delta = ev.type==='bad'
        ? (passiveReduced?Math.round(ev.base*0.15):ev.base)
        : (passiveReduced?Math.round(ev.base*0.35):ev.base);
      resolveOutcome({ delta, reduced:passiveReduced, narrative: passiveReduced?ev.mitigateText:ev.hitText });
      return;
    }

    // Otherwise your background alone leaves you exposed — but you may still be
    // able to buy your way to the better outcome, if you have the capital for it.
    const card = (active.preferredCardId && state.cards.find(c=> c.id===active.preferredCardId && !c.used))
      || state.cards.find(c=> c.shield>0 && !c.used);
    const cashCost = Math.round(Math.abs(ev.base)*0.4);
    const canCash = state.cash >= cashCost;

    $('#stage-root').innerHTML = `
      <span class="eyebrow">STEP 9 · 인생 이벤트 · ${ROUND_LABEL[round]}</span>
      <h2 class="stage-title display">${ev.title}</h2>
      <div class="event-card good">
        <div class="event-title">💼 ${state.career.name} 소득</div>
        <p style="margin:0">이번 시기 소득으로 <span class="delta pos">+${won(income)}</span>가 쌓였습니다.</p>
      </div>
      <p class="stage-desc" style="margin:14px 0 10px">${ev.type==='bad' ? '이 위기, 어떻게 대응하시겠어요?' : '이 기회를 어떻게 살리시겠어요?'}</p>
      <div class="choice-grid">
        <button class="choice-card" id="btnCard" ${!card?'disabled':''}>
          <div class="choice-title">${card ? active.cardLabel(card) : '🔒 인맥 카드 없음'}</div>
          <div class="choice-meta">${card ? '보유한 인맥 카드를 소모합니다 (재사용 불가)' : '동원할 수 있는 인맥 카드가 없습니다'}</div>
        </button>
        <button class="choice-card" id="btnCash" ${!canCash?'disabled':''}>
          <div class="choice-title">${active.cashLabel(cashCost)}</div>
          <div class="choice-meta">${canCash ? `가진 자산의 ${pctOfWealth(cashCost)}` : `자산 부족 (${won(cashCost)} 필요)`}</div>
        </button>
        <button class="choice-card" id="btnPassive">
          <div class="choice-title">${ev.type==='bad'?'🤷 그냥 감수하기':'🍃 흐름에 맡기기'}</div>
          <div class="choice-meta">아무것도 쓰지 않고 지금까지 쌓아온 배경에 맡깁니다</div>
        </button>
      </div>`;

    if(card) $('#btnCard').addEventListener('click', ()=>{
      card.used = true;
      const delta = ev.type==='bad' ? Math.round(ev.base*0.15) : ev.base;
      resolveOutcome({ delta, reduced:true, narrative: active.cardText(card),
        titleOverride: ev.type==='bad' ? `🛡️ ${card.name} 인맥으로 위기를 방어했습니다` : `🍀 ${card.name} 인맥 덕분에 기회를 온전히 잡았습니다` });
    });
    if(canCash) $('#btnCash').addEventListener('click', ()=>{
      const delta = ev.type==='bad' ? Math.round(ev.base*0.15) : ev.base;
      resolveOutcome({ delta, reduced:true, narrative: active.cashText(cashCost), cost:cashCost, costLabel:'자산 투입',
        titleOverride: ev.type==='bad' ? '🛡️ 자산을 투입해 위기를 막았습니다' : '🍀 자산을 투입해 기회를 온전히 잡았습니다' });
    });
    $('#btnPassive').addEventListener('click', ()=>{
      const delta = ev.type==='bad' ? ev.base : Math.round(ev.base*0.35);
      resolveOutcome({ delta, reduced:passiveReduced, narrative: ev.type==='bad'?ev.hitText:ev.mitigateText });
    });
  }
  draw();
};

/* =========================================================
   stage: teamsettle — this team's personal settlement, then
   hand off to the next team's draft turn (or to the class ranking)
   ========================================================= */
function counterfactualTable(s){
  // Use the tier's raw startCash (not the post-sibling-split startCashActual) so the
  // player's own tier row reproduces the actual final cash exactly — the sibling split
  // is intentionally excluded from every row here (see disclaimer below), so the delta
  // must be measured against the same unsplit baseline it's added back onto.
  const earnedDelta = s.cash - s.tier.startCash;
  const rows = SES_TIERS.map(t=>{
    const hypoCash = Math.max(0, t.startCash + earnedDelta);
    const hypoTier = tierById(tierForCash(hypoCash));
    const isActual = t.id === s.tier.id;
    return `<tr${isActual?' style="font-weight:800;background:var(--accent-soft)"':''}>
      <td>${isActual?'👉 ':''}${t.name}</td>
      <td class="mono">${won(hypoCash)}</td>
      <td>${hypoTier.name}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="data-table"><thead><tr><th>출생 가문</th><th>같은 선택·같은 운이었다면 최종 자산</th><th>도달 계층</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  const mobText = mobility>0 ? `▲ 상승 이동 (${mobility}단계)` : (mobility<0 ? `▼ 하강 이동 (${Math.abs(mobility)}단계)` : '● 계층 고착 (출발과 동일)');
  const isLast = game.draftPointer+1 >= game.draftOrder.length;

  $('#stage-root').innerHTML = `

    <div class="statbar-wrap"><div class="statbar-label"><span>문화자본</span><span>${state.stats.culture}</span></div><div class="statbar-track"><div class="statbar-fill" style="width:${state.stats.culture}%;background:var(--cap-culture)"></div></div></div>
    <div class="statbar-wrap"><div class="statbar-label"><span>사회자본</span><span>${state.stats.social}</span></div><div class="statbar-track"><div class="statbar-fill" style="width:${state.stats.social}%;background:var(--cap-social)"></div></div></div>
    <div class="statbar-wrap"><div class="statbar-label"><span>정보력</span><span>${state.stats.info}</span></div><div class="statbar-track"><div class="statbar-fill" style="width:${state.stats.info}%;background:var(--cap-info)"></div></div></div>
    <p style="font-size:14px;color:var(--ink-soft)">수능 ${state.csatCorrect}/${state.csatTotal} · NCS ${state.ncsCorrect}/${state.ncsTotal} · 인맥 카드 ${state.cards.length}장</p>

    <details class="panel" open>
      <summary>🔁 만약 다른 가문에서 태어났다면?</summary>
      <div class="panel-body">
        <p>당신이 실제로 내린 선택과 겪은 운(미션·입시·퀴즈 점수·인생 이벤트)은 그대로 두고, <b>출생 가문만</b> 바꿔봤을 때의 결과입니다.</p>
        ${counterfactualTable(state)}
        <p style="font-size:12px;color:var(--ink-faint)">※ 형제자매 수에 따른 자산 분할 효과는 계산을 단순화하기 위해 제외했습니다.</p>
      </div>
    </details>

    <div class="btn-row"><button class="btn btn-primary" id="btnNext">${isLast? '전체 랭킹 보기 →' : '다음 조 직업 선택 →'}</button></div>`;

/* =========================================================
   leaderboard (localStorage, per-browser only — spans sessions)
   ========================================================= */
function saveClassRun(){
  try{
    const key = 'habitusLeaderboard';
    const prev = JSON.parse(localStorage.getItem(key) || '[]');
    game.teams.forEach(t=>{
      prev.push({
        name: t.teamName, avatar: t.avatar,
        startTier: t.tier.name, finalTier: tierById(t.finalTierId).name,
        cash: t.cash, mobility: TIER_RANK[t.tier.id]-TIER_RANK[t.finalTierId],
        ts: Date.now(),
      });
    });
    localStorage.setItem(key, JSON.stringify(prev.slice(-100)));
  }catch(e){ /* localStorage unavailable — skip silently */ }
}
function loadBoard(){
  try{ return JSON.parse(localStorage.getItem('habitusLeaderboard') || '[]').sort((a,b)=> b.cash-a.cash).slice(0,12); }
  catch(e){ return []; }
}

        </div>
        <h4>게임 속 장치 ↔ 사회학 개념</h4>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>게임 속 장치</th><th>연결되는 개념</th></tr></thead><tbody>
          ${CONCEPT_MAP.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}
        </tbody></table></div>
        <p style="font-size:12.5px;color:var(--ink-faint)">참고: Bourdieu의 자본 이론, Coleman의 사회자본론, Akee 외의 부모소득-자녀성과 연구 등을 교육용으로 단순화했습니다. 실제 사회는 이 게임보다 훨씬 더 복잡한 변수들이 얽혀 있습니다.</p>
      </div>
    </details>

    <details class="panel">
      <summary>🏫 교실 토론 질문</summary>
      <div class="panel-body">
        <ul>
          <li>가장 먼저 직업을 고른 조와 가장 늦게 고른 조를 갈랐던 결정적 차이는 무엇이었나요?</li>
          <li>최종 자산 중 몇 %가 '운(출생)' 덕분이고, 몇 %가 '선택과 노력' 덕분이라고 생각하나요?</li>
          <li>[10통사2-02-03]이 말하는 '사회 계층의 양극화'를 이 게임은 어떤 장치로 표현했나요?</li>
          <li>교육격차·정보격차를 줄이기 위해 학교나 국가가 할 수 있는 일은 무엇일까요?</li>
        </ul>
      </div>
    </details>

    <details class="panel">
      <summary>🏆 이 브라우저의 누적 기록판 (${board.length}건)</summary>
      <div class="panel-body">
        ${board.length? `<div class="table-wrap"><table class="data-table"><thead><tr><th>조</th><th>출발</th><th>도착</th><th>자산</th><th>이동</th></tr></thead><tbody>
          ${board.map(r=>`<tr><td>${r.avatar} ${escapeHtml(r.name)}</td><td>${r.startTier}</td><td>${r.finalTier}</td><td class="mono">${won(r.cash)}</td><td>${r.mobility>0?'▲'+r.mobility:(r.mobility<0?'▼'+Math.abs(r.mobility):'●')}</td></tr>`).join('')}
        </tbody></table></div>
        <p style="font-size:12px;color:var(--ink-faint)">이 기록은 이 브라우저에만, 지금까지 플레이한 모든 판에 걸쳐 누적됩니다. 다른 반/기기와 비교하려면 이 화면을 캡처해 공유해 보세요.</p>` : ''}
      </div>
    </details>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnReplay">🔁 처음부터 다시하기</button>
    </div>`;

  $('#btnReplay').addEventListener('click', ()=>{ game = null; state = null; goStage('title'); });
};

/* =========================================================
   boot
   ========================================================= */
document.addEventListener('DOMContentLoaded', ()=>{ goStage('title'); });
</script>
</body>
</html>
