/* ── 추가 요소 ───────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chips span{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;line-height:1.6}
.chip-token{background:#f3e6c9;color:#7a5c1e}
.chip-info{background:#dde9e3;color:#2f5d4f}
.chip-loan{background:#eadfe9;color:#6c4468}
.chip-debt{background:#f3dcd6;color:#8c4630}

.helper-box{margin-top:14px;padding:12px;border:1px dashed #cfc7ae;border-radius:12px;background:#fffdf4}
button.helper{display:block;width:100%;text-align:left;margin-top:6px;font-size:13px;font-weight:600;background:#f1ece0;border:1px solid #ddd5bf;border-radius:10px;padding:9px 11px;cursor:pointer}
button.helper:hover:not(:disabled){background:#e8e1d0}
button.helper:disabled{opacity:.5;cursor:default}

.choice .why{display:block;margin-top:5px;font-size:11px;color:#8a6b4a;line-height:1.5}
.choice.unknown{border-style:dashed;background:#f2efe4;color:#8a8574;cursor:default}
.choice.unknown b{color:#8a8574}
.choice.info-choice{border-color:#a9c8b8;background:#f2f8f4}
.choice.info-choice b::after{content:'정보';font-size:9px;font-weight:800;background:#cfe3d8;color:#2f5d4f;border-radius:999px;padding:2px 6px;margin-left:6px;vertical-align:2px}

.peek{margin:12px 0 4px}
.peek-row{display:flex;gap:5px;margin-top:6px}
.peek-cell{flex:1;background:var(--tile);border:1px solid #ffffffaa;border-radius:8px;padding:5px 2px;text-align:center;font-size:11px;line-height:1.5}
.peek-cell b{display:block;font-size:9px;color:#7d7867}
.peek-cell i{display:block;font-style:normal;font-size:14px}
.peek-cell em{display:block;font-style:normal;font-size:9px;font-weight:600}

.crisis-table{margin:12px 0 8px;display:flex;flex-direction:column;gap:6px}
.crisis-row{display:grid;grid-template-columns:70px 1fr 62px;align-items:center;gap:8px;font-size:12px}
.crisis-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crisis-row i{height:10px;border-radius:999px;background:var(--pc);display:block;min-width:4px}
.crisis-row span{text-align:right;font-weight:700;color:#8c4630}
.crisis-note{background:#f7e7df;border:1px solid #e8cdc0;border-radius:10px;padding:9px 11px;font-size:12px;margin:8px 0 12px}

.promise-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.promise-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffdf4;border:1px solid #e6e0cd;border-radius:10px;padding:9px 11px}
.promise-item.kept{background:#f1f7f1;border-color:#cfe0cf}
.promise-item b{font-size:12px}

.awards{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.award{background:#f7f1e0;border:1px solid #e8dfc5;border-left:3px solid var(--pc);border-radius:8px;padding:6px 9px}
.award b{display:block;font-size:12px}
.award span{font-size:11px;color:#7d7867}

svg.chart{width:100%;height:auto;margin-top:10px}

@media print{.helper-box,.promise-item button{display:none!important}}

/* v3: clearer controls and compact-screen ergonomics */
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid #bd673d;outline-offset:3px}
button:disabled{cursor:not-allowed} .helper-box{border-left:3px solid #5c8973} .crisis-row{min-height:42px}.crisis-row span{font-size:11px}.choice{transition:transform .16s,border-color .16s}.choice:not(:disabled):hover{transform:translateY(-2px);border-color:#5c8973}
@media(max-width:600px){.nav{gap:5px}.nav button{padding:8px;font-size:11px}.control .row button{min-height:40px}.crisis-row{grid-template-columns:65px 1fr 90px}.result-card{padding:16px}dialog{max-height:86dvh;overflow:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── 자본 능력치(HP/MP 스타일) ───────────────────────────────── */
.capital-stats{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.capital-stat{display:grid;grid-template-columns:15px 30px 1fr 20px;align-items:center;gap:5px;font-size:9px}
.capital-stat .cap-label{color:var(--muted);font-weight:700;white-space:nowrap}
.capital-stat .cap-track{height:6px;background:#e7e8dc;border-radius:4px;overflow:hidden}
.capital-stat .cap-fill{height:100%;border-radius:4px;transition:width .3s}
.capital-stat .cap-val{text-align:right;font-weight:700;color:var(--ink)}

function aiAction(g,id=actor(g)){

 }
 if(g.phase==='offer'){
  const me=g.players[id],k=g.offer.kind;
  const ok=k==='ask'?me.cash>=180:k==='business'?me.cash>=260:me.cash>=340&&g.offer.rate>=20;
  return{...base,type:'respond',value:ok?'yes':'no'};
 }
 if(g.phase==='rate')return{...base,type:'rate',value:20};
 if(g.phase==='target'){
  const cost=g.pending==='ask'?60:g.pending==='business'?100:200;
  const q=g.players.find(x=>x.id!==g.turn&&x.cash>=cost);
  return{...base,type:'target',value:q?q.id:'cancel'};
 }
 const valid=options(g).filter(o=>!o.disabled&&o.known),p=g.players[g.turn];
 let choice;
 if(p.health<3)choice=valid.find(o=>['rest','clinic','friend','recover'].includes(o.id));
 if(!choice&&p.debt>=400)choice=valid.find(o=>o.id==='repay');
 if(!choice&&p.cash<60&&g.event.type==='market')choice=valid.find(o=>o.id==='loan');
 if(!choice&&g.event.type==='career')choice=valid[0];
 if(!choice)choice=valid.find(o=>o.info)||valid[(g.round+id)%valid.length];
 return{...base,type:'choose',value:choice.id};
}
function aiAssist(g){

 const unknown=ops.filter(o=>!o.known);
 if(unknown.length&&roll<55){
  const sharer=helpers.find(q=>hasInfo(q)&&q.sharedRound!==g.round);
  if(sharer)return{actor:sharer.id,type:'share',value:unknown[0].id,expected:g.revision,...contextOf(g)};
 }
 const adv=ops.filter(o=>o.advisable);
 if(adv.length&&roll<35){
  const giver=helpers.find(q=>q.tokens>0);
  if(giver)return{actor:giver.id,type:'advise',value:adv[0].id,expected:g.revision,...contextOf(g)};
 }
 return null;
}

function historyChart(g,w=700,h=210){

 const lines=g.players.map(p=>`<polyline fill="none" stroke="${COLORS[p.id]}" stroke-width="2.6" stroke-linejoin="round" points="${rows.map((r,i)=>x(i).toFixed(1)+','+y(r.assets[p.id]).toFixed(1)).join(' ')}"/>`).join('');
 const dots=g.players.map(p=>rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.assets[p.id]).toFixed(1)}" r="2.8" fill="${COLORS[p.id]}"/>`).join('')).join('');
 const zero=lo<0?`<line x1="${pad}" y1="${y(0).toFixed(1)}" x2="${w-pad}" y2="${y(0).toFixed(1)}" stroke="#bdb7a4" stroke-dasharray="4 4"/>`:'';
 const ticks=rows.map((r,i)=>`<text x="${x(i).toFixed(1)}" y="${h-10}" font-size="10" fill="#8a8574" text-anchor="middle">R${r.round}</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="라운드별 팀 순자산 변화"><line x1="${pad}" y1="16" x2="${pad}" y2="${h-pad}" stroke="#ddd7c4"/><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ddd7c4"/>${zero}${lines}${dots}${ticks}<text x="${pad-6}" y="22" font-size="10" fill="#8a8574" text-anchor="end">${num(hi)}</text></svg>`;
}

function openProjector(){
 try{
  if(projWin&&!projWin.closed){projWin.focus();paintProjector();return;}
  projWin=window.open('','nlh-projector','width=1280,height=840');
  if(!projWin){toast('팝업이 차단되어 있어요. 브라우저에서 이 페이지의 팝업을 허용해주세요.');return;}
  projWin.document.open();
  projWin.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>인생 한 바퀴 · 진행 화면</title><style>'+PROJ_CSS+'</style></head><body><div id="pj"></div></body></html>');
  projWin.document.close();
  paintProjector();
  toast('진행 화면을 새 창으로 열었어요. 프로젝터로 옮겨주세요.');
 }catch(e){toast('진행 화면을 열 수 없어요.');}
}
function paintProjector(){
 try{
  if(!projWin||projWin.closed||!game)return;
  const host=projWin.document.getElementById('pj');if(!host)return;
  const ws=game.players.map(wealth),hi=Math.max(...ws),lo=Math.min(...ws);
  const gap=lo>0?`${(hi/lo).toFixed(1)}배`:'최하위가 마이너스';
  const stage=game.phase==='done'?'게임 종료':game.phase==='vote'?'사회회의 진행 중':game.phase==='crisis'?'공동 위기 확인 중':game.phase==='forecast'?'시장 예측 중':`${esc(game.players[game.turn].name)}의 차례`;
  host.innerHTML=`<h1>인생 한 바퀴 · ${game.round} / ${game.maxRounds} 라운드 · ${age(game)}세</h1><div class="sub">${stage}</div><div class="big"><div class="stat"><span>1위와 최하위 순자산 차이</span><b>${gap}</b></div><div class="stat"><span>공동기금</span><b>${num(game.fund)}</b></div><div class="stat"><span>${esc(game.market)}</span><b>${game.policies.length?game.policies.map(k=>POLICIES[k].icon).join(' '):'정책 없음'}</b></div></div><div>${game.policies.map(k=>`<span class="pol">${POLICIES[k].icon} ${POLICIES[k].name}</span>`).join('')||''}</div><div class="grid" style="margin-top:16px">${game.players.map(p=>`<div class="card" style="--pc:${COLORS[p.id]}"><b>${ICONS[p.id]} ${esc(p.name)}</b><div class="v">${num(wealth(p))}</div><div class="m">${p.job} · 건강 ${p.health}/6</div><div class="m">인적 ${p.skill} · 사회 ${p.trust} · 문화 ${p.culture} · 총자본 ${num(totalCapital(p))}</div><div class="m">도움 ${p.help}회 · 정보 공유 ${p.shared}회 · 토큰 ${p.tokens}개</div></div>`).join('')}</div>${historyChart(game,900,260)}<div class="foot">금액 단위는 게임머니입니다. 현실의 소득·투자수익을 예측하는 모형이 아닙니다.</div>`;
 }catch(e){}
}
window.addEventListener('beforeunload',persist);home();const invite=new window.URLSearchParams(location.search).get('room');if(invite){setup('online');$('online-code').value=invite.slice(0,6);}</script></body></html>
